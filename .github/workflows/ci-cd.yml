name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run automated tests
        run: npm test

  docker:
    name: Docker Build and Smoke Test
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t hostel-complaint-register:${{ github.sha }} .

      - name: Run Docker container
        run: |
          docker run -d \
            --name hostel-app \
            -p 3000:3000 \
            hostel-complaint-register:${{ github.sha }}

      - name: Wait for application
        run: sleep 5

      - name: Run health check
        run: curl --fail http://localhost:3000/health

      - name: Stop Docker container
        if: always()
        run: docker stop hostel-app

  deploy:
    name: Deploy to Render
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deployment
        run: |
          curl --fail --request POST \
            "${{ secrets.RENDER_DEPLOY_HOOK }}&ref=${{ github.sha }}"